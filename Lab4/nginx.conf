events { 
    worker_connections 1024; 
}

http {
    upstream roombook_backend {
        
        server localhost:7242 max_fails=3 fail_timeout=10s;
        server localhost:7243 max_fails=3 fail_timeout=10s;
        server localhost:7244 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8888;
        server_name localhost;

        location / {
            proxy_pass https://roombook_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse on;
        }
    }
}